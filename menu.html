<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coffee House - Menu</title>
    <link rel="icon" type="image/x-icon" href="assets/favicon.ico">
    <link rel="stylesheet" href="styles/style.css">
</head>
<body>
    <header class="header">
        <div class="container">
            <div class="header-content">
                <a href="index.html" class="logo">
                    <img src="assets/Logo.png" alt="Coffee House">
                </a>
                <nav class="nav">
                    <a href="index.html#favorites" class="nav-link">Favorite coffee</a>
                    <a href="index.html#about" class="nav-link">About</a>
                    <a href="index.html#mobile-app" class="nav-link">Mobile app</a>
                    <a href="#footer" class="nav-link">Contact us</a>
                </nav>
                <span class="menu-btn disabled">Menu</span>
                <div class="burger">
                    <span></span>
                    <span></span>
                </div>
            </div>
        </div>
    </header>

    <main>
        <section class="menu-section">
            <div class="container">
                <h1 class="section-title">Behind each of our cups hides an <span>amazing surprise</span></h1>
                
                <div class="menu-tabs">
                    <button class="tab-btn active" data-category="coffee">
                        <img src="assets/coffee-cup.svg" alt="Coffee">
                        Coffee
                    </button>
                    <button class="tab-btn" data-category="tea">
                        <img src="assets/tea-cup.svg" alt="Tea">
                        Tea
                    </button>
                    <button class="tab-btn" data-category="dessert">
                        <img src="assets/dessert.svg" alt="Dessert">
                        Dessert
                    </button>
                </div>

                <div class="menu-grid" id="menu-grid">
                    <!-- Products will be loaded here by JavaScript -->
                </div>

                <button class="load-more-btn" id="load-more-btn" style="display: none;">Load More</button>
            </div>
        </section>
    </main>

    <footer id="footer" class="footer">
        <div class="container">
            <div class="footer-content">
                <div class="footer-info">
                    <h3>Sip, Savor, Smile. <span>It's coffee time!</span></h3>
                    <div class="social-links">
                        <a href="#" class="social-link">
                            <img src="assets/twitter.svg" alt="Twitter">
                        </a>
                        <a href="#" class="social-link">
                            <img src="assets/instagram.svg" alt="Instagram">
                        </a>
                        <a href="#" class="social-link">
                            <img src="assets/facebook.svg" alt="Facebook">
                        </a>
                    </div>
                </div>
                <div class="footer-contacts">
                    <h4>Contact us</h4>
                    <div class="contact-item">
                        <img src="assets/pin-alt.svg" alt="Address">
                        <a href="https://maps.google.com" target="_blank" rel="noopener noreferrer">8558 Green Rd., LA</a>
                    </div>
                    <div class="contact-item">
                        <img src="assets/phone.svg" alt="Phone">
                        <a href="tel:+16035550123">+1 (603) 555-0123</a>
                    </div>
                    <div class="contact-item">
                        <img src="assets/clock.svg" alt="Hours">
                        <span>Mon-Sat: 9:00 AM – 23:00 PM</span>
                    </div>
                </div>
            </div>
        </div>
    </footer>

    <!-- Modal -->
    <div class="modal" id="product-modal">
        <div class="modal-overlay"></div>
        <div class="modal-content">
            <button class="modal-close">×</button>
            <div class="modal-body">
                <div class="modal-image">
                    <img id="modal-product-image" src="" alt="">
                </div>
                <div class="modal-info">
                    <h3 id="modal-product-name"></h3>
                    <p id="modal-product-description"></p>
                    
                    <div class="modal-options">
                        <div class="size-options">
                            <h4>Size</h4>
                            <div class="option-buttons" id="size-options">
                                <!-- Size options will be populated by JavaScript -->
                            </div>
                        </div>
                        
                        <div class="additives-options">
                            <h4>Additives</h4>
                            <div class="option-buttons" id="additives-options">
                                <!-- Additive options will be populated by JavaScript -->
                            </div>
                        </div>
                    </div>
                    
                    <div class="modal-footer">
                        <div class="total-price">Total: <span id="total-price">$0.00</span></div>
                    </div>
                    
                    <button id="add-to-cart" class="add-to-cart-btn">Dodaj do koszyka</button>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
